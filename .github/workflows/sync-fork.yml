name: Sync Fork with Upstream

on:
  schedule:
    # This will run every 10 min
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Checkout the forked repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Add upstream remote
        run: |
          if ! git remote get-url upstream 2>/dev/null; then
            git remote add upstream https://github.com/netdata/netdata.git
          fi
          git fetch upstream
          
      - name: Sync master branch
        run: |
          git checkout -b origin/master
          git merge --ff-only upstream/master
          git push origin master
      
      - name: Rebase nvme_raid onto master
        run: |
          git checkout nvme_raid
          git merge origin/master
          git push origin nvme_raid
          
