name: Sync Fork with Upstream

on:
  schedule:
    # This will run every 10 min
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Checkout the forked repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # # Set up Git configuration
      # - name: Set up Git configuration
      #   run: |
      #     if ! git config --global user.name; then
      #       git config --global user.name "GitHub Actions"
      #     fi
      #     if ! git config --global user.email; then
      #       git config --global user.email "actions@github.com"
      #     fi

      # Add the upstream repository as a remote
      - name: Add upstream remote
        run: |
          if ! git remote get-url upstream; then
            git remote add upstream https://github.com/netdata/netdata.git
          fi
          git fetch upstream
          
      # Fetch and fast-forward merge changes into the master branch
      - name: Sync master branch
        run: |
          git checkout master
          git merge --ff-only upstream/master
          git push origin master
      
      # Fetch and fast-forward merge changes into the nvme_raid branch
      - name: Sync nvme_raid branch
        run: |
          git checkout nvme_raid
          git merge --ff-only master --allow-unrelated-histories
          git push origin nvme_raid


