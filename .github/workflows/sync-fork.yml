name: Sync Fork with Upstream

on:
  schedule:
    # This will run at midnight UTC every day, adjust the cron expression as needed
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Checkout the forked repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Git user to commit changes
      - name: Set up Git configuration
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # Add the upstream repository as a remote
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/netdata/netdata.git
          git fetch upstream

      # Fetch and merge changes into the master branch
      - name: Sync master branch
        run: |
          git checkout master
          git merge upstream/master --no-ff --commit -m "Sync with upstream master"
          git push origin master

      # Fetch and merge changes into the nvme_raid branch
      - name: Sync nvme_raid branch
        run: |
          git checkout nvme_raid
          git merge master
          git push origin nvme_raid

